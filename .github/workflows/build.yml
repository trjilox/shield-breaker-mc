name: Build JAR
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: ShieldBreaker-JAR
          path: build/libs/*.jar
